# SonarCloud 專案設定
# 此檔案配置 SonarCloud 程式碼品質掃描的相關參數

# 專案基本資訊
sonar.projectKey=${SONAR_PROJECT_KEY}
sonar.organization=${SONAR_ORGANIZATION}

# 專案名稱和版本
sonar.projectName=Lab1 - Secure CI/CD Pipeline Demo
sonar.projectVersion=1.0

# 原始碼路徑設定
sonar.sources=app
sonar.sourceEncoding=UTF-8

# 排除不需要掃描的檔案和目錄
sonar.exclusions=\
  **/node_modules/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/coverage/**,\
  **/dist/**,\
  **/build/**,\
  **/.git/**

# JavaScript/HTML/CSS 特定設定
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 程式碼覆蓋率報告路徑（如果有測試）
# sonar.coverage.exclusions=**/*.test.js,**/*.spec.js

# 設定掃描的語言
sonar.language=js,html,css

# 品質門檻設定（這些通常在 SonarCloud 網頁端設定）
# 這裡僅作為文件說明
# - 新程式碼覆蓋率 >= 80%
# - 新程式碼的重複度 <= 3%
# - 可維護性評級 >= A
# - 可靠性評級 >= A
# - 安全性評級 >= A

# Pull Request 分析設定
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=${GITHUB_REPOSITORY}

# 分支分析設定
sonar.branch.name=${GITHUB_REF_NAME}

# 掃描輸出設定
sonar.verbose=false
sonar.log.level=INFO